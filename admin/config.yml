backend:
  name: git-gateway
  branch: main

media_folder: "assets/img"
public_folder: "/assets/img"

collections:
  - name: "blog"
    label: "Blog Config"
    delete: false # Prevents accidental structural deletions
    editor:
      preview: false
    files:
      - name: "posts"
        label: "Blog Posts"
        file: "data/posts.json"
        type: "json"
        format: "json"
        slug: "{{slug}}"
        fields:
          - label: "Posts List"
            name: "posts"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "ID/Slug", name: "id", widget: "string", hint: "e.g., how-i-built-an-ai-portfolio" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Category", name: "category", widget: "string" }
              - { label: "Excerpt / Short Summary", name: "excerpt", widget: "text" }
              - { label: "Body Content", name: "body", widget: "markdown" }
              - { label: "Date", name: "date", widget: "date", format: "YYYY-MM-DD" }
